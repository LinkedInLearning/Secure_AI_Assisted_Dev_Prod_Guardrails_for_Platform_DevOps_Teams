name: CI Pipeline - Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast path for hotfixes
  sensor-api:
    name: Sensor API - Lint, Test, Build
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'hotfix/') }}
    defaults:
      run:
        working-directory: services/sensor-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/sensor-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Run tests
        if: ${{ !contains(github.event.head_commit.message, '[skip-tests]') }}
        run: npm test

      - name: Build
        run: npm run build

  # Security scan runs in parallel, doesn't block anything
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sensor-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

  terraform:
    name: Terraform - Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/azure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.1

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

  # Can run immediately without waiting for tests or security
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ terraform ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: echo "Deploying to staging..."
