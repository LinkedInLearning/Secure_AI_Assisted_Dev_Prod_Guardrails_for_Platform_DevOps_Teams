name: Infrastructure Validation

on:
  pull_request:
    paths:
      - "infrastructure/**"

jobs:
  validate-changes:
    name: Validate Infrastructure Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.1

      - name: Terraform Init
        run: |
          cd infrastructure/azure
          terraform init

      - name: Detect Resource Deletions
        run: |
          chmod +x scripts/infrastructure-validation/detect-destroys.sh
          ./scripts/infrastructure-validation/detect-destroys.sh

      - name: Detect Breaking Changes
        run: |
          chmod +x scripts/infrastructure-validation/detect-breaking-changes.sh
          ./scripts/infrastructure-validation/detect-breaking-changes.sh

      - name: Generate Plan Summary
        if: always()
        run: |
          cd infrastructure/azure
          terraform plan -no-color > ../../plan-summary.txt

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan-summary.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${plan}\n\`\`\``
            });
