name: Infrastructure Security Validation

on:
  pull_request:
    paths:
      - "infrastructure/**"

jobs:
  security-checks:
    name: Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.1

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Terraform Init
        run: |
          cd infrastructure/azure
          terraform init

      - name: Validate IAM Scope
        run: |
          chmod +x scripts/security-validation/validate-iam-scope.sh
          ./scripts/security-validation/validate-iam-scope.sh

      - name: Validate Network Rules
        run: |
          chmod +x scripts/security-validation/validate-network-rules.sh
          ./scripts/security-validation/validate-network-rules.sh

      - name: Validate Storage Authentication
        run: |
          chmod +x scripts/security-validation/validate-storage-auth.sh
          ./scripts/security-validation/validate-storage-auth.sh

      - name: Run OPA Policy Checks
        run: |
          cd infrastructure/azure
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

          # Test against all security policies
          opa eval --data ../../policies/security \
            --input tfplan.json \
            --format pretty \
            'data.terraform.security' > policy-results.json

          # Check for policy violations
          VIOLATIONS=$(jq -r '.iam.deny + .network.deny + .auth.deny | length' policy-results.json)

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Policy violations detected:"
            jq -r '.iam.deny[], .network.deny[], .auth.deny[]' policy-results.json
            exit 1
          fi

          echo "✅ All policy checks passed"

      - name: Security Summary
        if: always()
        run: |
          echo "## Security Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- IAM Scope: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Network Rules: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Storage Authentication: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Policy Checks: ✅" >> $GITHUB_STEP_SUMMARY
