name: Deploy Crop Yield Predictor (With Guardrails)

on:
  pull_request:
    paths:
      - "services/crop-yield-predictor/**"
      - "deployments/crop-yield-predictor/**"
      - "infrastructure/crop-yield-predictor/**"
  push:
    branches:
      - main
    paths:
      - "services/crop-yield-predictor/**"

jobs:
  # SECTION 6: Supply Chain Guardrails
  supply-chain-scan:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: services/crop-yield-predictor
        run: npm ci

      # Vulnerability scanning
      - name: Run npm audit
        working-directory: services/crop-yield-predictor
        run: npm audit --audit-level=high

      # License compliance
      - name: Check licenses
        working-directory: services/crop-yield-predictor
        run: |
          npx license-checker --summary --failOn "GPL;AGPL"

      # Generate SBOM
      - name: Generate SBOM
        working-directory: services/crop-yield-predictor
        run: |
          npx @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file ../../sbom/crop-predictor/sbom-${{ github.sha }}.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/crop-predictor/

  # SECTION 5: Kubernetes Security Validation
  kubernetes-policy-check:
    name: Kubernetes Policy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2

      - name: Validate resource limits
        run: |
          opa eval --data policies/kubernetes/resource-limits.rego \
            --input deployments/crop-yield-predictor/deployment.yaml \
            "data.kubernetes.resource_limits.deny" \
            --fail-defined

      - name: Validate health probes
        run: |
          opa eval --data policies/kubernetes/health-probes.rego \
            --input deployments/crop-yield-predictor/deployment.yaml \
            "data.kubernetes.health_probes.deny" \
            --fail-defined

      - name: Validate security context
        run: |
          opa eval --data policies/kubernetes/security-context.rego \
            --input deployments/crop-yield-predictor/deployment.yaml \
            "data.kubernetes.security_context.deny" \
            --fail-defined

  # SECTION 4: Infrastructure Change Validation
  terraform-validation:
    name: Terraform Security Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infrastructure/crop-yield-predictor
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/crop-yield-predictor
        run: terraform plan -out=tfplan

      - name: Validate network security
        working-directory: infrastructure/crop-yield-predictor
        run: |
          # Check for network restrictions
          terraform show -json tfplan | \
            jq '.planned_values.root_module.resources[] | 
                select(.type == "azurerm_storage_account") | 
                select(.values.network_rules == null)' \
            && echo "❌ Storage account missing network rules" && exit 1 || \
            echo "✅ Network rules configured"

      - name: Validate IAM scope
        working-directory: infrastructure/crop-yield-predictor
        run: |
          # Check for subscription-wide role assignments
          terraform show -json tfplan | \
            jq '.planned_values.root_module.resources[] | 
                select(.type == "azurerm_role_assignment") | 
                select(.values.scope | contains("subscriptions"))' \
            && echo "❌ Subscription-wide role assignment detected" && exit 1 || \
            echo "✅ IAM properly scoped"

  # Build and Test
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [ supply-chain-scan, kubernetes-policy-check ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: services/crop-yield-predictor
        run: npm ci

      - name: Run tests
        working-directory: services/crop-yield-predictor
        run: npm test

      - name: Build Docker image
        run: |
          docker build -t teriana/crop-yield-predictor:${{ github.sha }} \
            services/crop-yield-predictor

      - name: Scan Docker image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity HIGH,CRITICAL \
            teriana/crop-yield-predictor:${{ github.sha }}

  # SECTION 7: Progressive Delivery
  deploy:
    name: Deploy with Progressive Delivery
    runs-on: ubuntu-latest
    needs: [ build, terraform-validation ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Argo Rollout
        run: |
          kubectl apply -f config/progressive-delivery/crop-predictor-rollout.yaml
          kubectl apply -f config/progressive-delivery/analysis-templates.yaml

      - name: Monitor Rollout
        run: |
          kubectl argo rollouts status crop-yield-predictor -n production
