# BAD: Allow workflow runs without approval from forks
name: CI with Weak Approval

on:
  pull_request_target:
    # DANGEROUS: Runs with write permissions from forks
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run untrusted code
        run: npm install && npm run build
