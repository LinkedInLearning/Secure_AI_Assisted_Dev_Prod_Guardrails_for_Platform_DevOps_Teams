# GOOD: Has resource limits and health probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-processor
  namespace: teriana-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sensor-processor
  template:
    metadata:
      labels:
        app: sensor-processor
    spec:
      containers:
        - name: processor
          image: teriana/sensor-processor:v1.2.3 # Pinned version, not latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: LOG_LEVEL
              value: "info"
