# SAFE: Resource limits prevent resource exhaustion
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-processor
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sensor-processor
  template:
    metadata:
      labels:
        app: sensor-processor
    spec:
      containers:
        - name: processor
          image: teriana/sensor-processor:v1.2.0
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi" # Hard limit - pod killed if exceeded
              cpu: "500m" # Throttled if exceeded
            requests:
              memory: "256Mi" # Scheduler guarantee
              cpu: "250m" # Minimum allocation
          env:
            - name: PROCESSING_MODE
              value: "batch"
