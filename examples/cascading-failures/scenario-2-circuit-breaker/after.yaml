# AFTER: Failure isolated with circuit breaker
# Timeline with circuit breaker:
# 1. Database becomes slow (5 second queries)
# 2. Requests timeout after 2 seconds
# 3. Circuit breaker detects failure rate
# 4. Opens circuit after 5 failures
# 5. New requests fail fast (no waiting)
# 6. Service stays responsive
# Result: Degraded service, but not cascading failure

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: teriana/api-gateway:v2.1.0
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          env:
            - name: DATABASE_URL
              value: "postgresql://db.production.svc:5432/teriana"
            - name: DB_TIMEOUT_MS
              value: "2000" # TIMEOUT: fail after 2 seconds
            - name: CIRCUIT_BREAKER_ENABLED
              value: "true"
            - name: CIRCUIT_BREAKER_THRESHOLD
              value: "5" # Open after 5 failures
            - name: CIRCUIT_BREAKER_TIMEOUT_MS
              value: "30000" # Try again after 30 seconds
          ports:
            - containerPort: 80
            # With circuit breaker:
            # - Requests timeout quickly
            # - Circuit opens to prevent cascading
            # - Service returns degraded responses instead of hanging
