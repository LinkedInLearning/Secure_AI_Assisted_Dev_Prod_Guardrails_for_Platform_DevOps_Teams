# AFTER: Pod failure contained to single container
# Timeline with limits:
# 1. sensor-processor has memory leak
# 2. Hits 512Mi memory limit
# 3. Kubernetes kills ONLY this container
# 4. Container restarts
# 5. Other pods unaffected
# Result: 1 bug → 1 container restart, isolated failure

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-processor
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sensor-processor
  template:
    metadata:
      labels:
        app: sensor-processor
    spec:
      containers:
      - name: processor
        image: teriana/sensor-processor:v1.2.0
        resources:
          limits:
            memory: "512Mi"  # LIMIT CONTAINS FAILURE
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080
        # With limit: OOM kills only this container
        # Other pods on node continue running normally

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: gateway
        image: teriana/api-gateway:v2.1.0
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
        # Continues running - node still has available memory

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
      - name: processor
        image: teriana/payment-processor:v3.0.0
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        # Continues running - node still has available memory