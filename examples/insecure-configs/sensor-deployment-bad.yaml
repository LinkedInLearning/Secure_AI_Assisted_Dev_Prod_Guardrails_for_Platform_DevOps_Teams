# BAD: Missing resource limits, missing probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-processor
  namespace: teriana-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sensor-processor
  template:
    metadata:
      labels:
        app: sensor-processor
    spec:
      containers:
        - name: processor
          image: teriana/sensor-processor:latest
          ports:
            - containerPort: 8080
            # MISSING: resources.limits
            # MISSING: resources.requests
            # MISSING: livenessProbe
            # MISSING: readinessProbe
          env:
            - name: LOG_LEVEL
              value: "info"
