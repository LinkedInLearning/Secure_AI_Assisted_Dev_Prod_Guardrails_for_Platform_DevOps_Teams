# Data Aggregator Service - Production Ready
# Fixed version with reliability configurations
# Original: AI-generated on 2026-05-10
# Fixed: Added resource limits, health probes, security context, replicas

apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-aggregator
  namespace: production
  labels:
    app: data-aggregator
    version: v1.0.0
    component: backend
    managed-by: platform-team
spec:
  replicas: 3  # FIXED: Multiple replicas for redundancy
  selector:
    matchLabels:
      app: data-aggregator
  template:
    metadata:
      labels:
        app: data-aggregator
        version: v1.0.0
    spec:
      # FIXED: Security context at pod level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: aggregator
        image: teriana/data-aggregator:v1.0.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # FIXED: Resource limits and requests
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        
        # FIXED: Liveness probe for automatic restart
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # FIXED: Readiness probe for traffic management
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # FIXED: Security context at container level
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: url
        - name: LOG_LEVEL
          value: "info"
        - name: WORKERS
          value: "4"
        - name: PROCESSING_BATCH_SIZE
          value: "1000"
        
        volumeMounts:
        - name: config
          mountPath: /etc/aggregator
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/aggregator
      
      volumes:
      - name: config
        configMap:
          name: aggregator-config
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      # FIXED: Pod anti-affinity to spread replicas
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - data-aggregator
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: data-aggregator
  namespace: production
  labels:
    app: data-aggregator
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: data-aggregator

---
# ADDED: PodDisruptionBudget for availability during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-aggregator-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: data-aggregator