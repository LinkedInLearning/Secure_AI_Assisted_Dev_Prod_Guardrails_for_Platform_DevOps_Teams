# AI-generated Kubernetes deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crop-yield-predictor
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crop-yield-predictor
  template:
    metadata:
      labels:
        app: crop-yield-predictor
    spec:
      containers:
        - name: predictor
          image: teriana/crop-yield-predictor:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://admin:password@postgres.production.svc.cluster.local:5432/\
                predictions"
            - name: REDIS_URL
              value: "redis://redis.production.svc.cluster.local:6379"
            - name: PORT
              value: "8080"
