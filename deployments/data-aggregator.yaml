# Data Aggregator Service
# Generated by AI assistant on 2026-05-10
# Purpose: Aggregate sensor data from field devices and expose REST API

apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-aggregator
  namespace: production
  labels:
    app: data-aggregator
    version: v1.0.0
    component: backend
    managed-by: platform-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-aggregator
  template:
    metadata:
      labels:
        app: data-aggregator
        version: v1.0.0
    spec:
      containers:
      - name: aggregator
        image: teriana/data-aggregator:v1.0.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: url
        - name: LOG_LEVEL
          value: "info"
        - name: WORKERS
          value: "4"
        - name: PROCESSING_BATCH_SIZE
          value: "1000"
        volumeMounts:
        - name: config
          mountPath: /etc/aggregator
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: aggregator-config
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: data-aggregator
  namespace: production
  labels:
    app: data-aggregator
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: data-aggregator